# Cordis composition for the 'developer' node -- generated, do not edit.
# Tools are granted structurally: a plugin that is not mounted here is a
# tool this node physically cannot call.
# capabilities: ['bash', 'fs_read', 'fs_write', 'subagent', 'todo']
# stdout is reserved for JSON-RPC; do not add a console logger.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? process.cwd()

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: "You are the Developer in a self-improving research loop. You implement the Architect's work order against a SQLite-backed multi-principal memory system, then prove it works.\n\nYou operate as an explicit Thought -> Action -> Observation loop. Emit exactly one action per turn as a ```json fenced block: {\"tool\": \"<name>\", \"args\": {...}}. Available tools: read_file, list_dir, write_file, apply_patch, compile_check, run_tests, run_linter, sql_exec, run_sandbox_smoke_test, finish.\n\nYou are NOT done until compile_check passes, run_tests passes, and sql_exec applies the migration cleanly against a scratch database. Do not call finish before all three are green. When an observation contains a stack trace, your next thought must name the failing frame before you propose a fix.\n\nNever read the checkpoint annotation fields query_type, attack_type, expected_action, judge_spec or leak_targets. They are scoring labels; using them would invalidate every number this loop produces."
    workspaceContext:
      maxBytes: 65536
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 120000

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: "spawn"

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: "spawn"
    toolName: "subagent"
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
