# Full GateMem paper-style experiment matrix.
# By default, this expands to 4 domains x 7 backbones x 7 baselines = 196 runs.
# Use command-line filters to run any subset, for example:
#   python scripts/sweep.py --config configs/sweeps/paper_matrix.yaml --domains medical --models gpt4omini --dry_run
#   python scripts/sweep.py --config configs/sweeps/paper_matrix.yaml --domains office --models gemini_flash_lite --baselines rag_naive rag_policy

base_config: configs/runs/paper_main.yaml
out_dir: outputs
max_parallel_runs: 1
run_name_template: "{domain}_{model_key}_{agent_key}"

# Shared overrides applied to every expanded run.
common_overrides:
  max_output_tokens: 4096
  use_llm_judge: true
  judge_provider: openai
  judge_model: gpt-4o
  judge_max_output_tokens: 4096
  judge_concurrency: 4
  embed_provider: openai
  embed_model: text-embedding-3-small
  embed_device: cpu
  top_k: 20
  show_ingest_progress: true

domains:
  medical: bench/data/medical
  office: bench/data/office
  education: bench/data/education
  household: bench/data/household

models:
  gpt4omini:
    llm_provider: openai
    llm_model: gpt-4o-mini
    temperature: 0.2

  gpt5mini:
    llm_provider: openai
    llm_model: gpt-5-mini
    reasoning_effort: low
    text_verbosity: low

  gemini_flash_lite:
    llm_provider: gemini
    llm_model: gemini-2.5-flash-lite
    temperature: 0.2

  deepseek_v4_pro:
    llm_provider: deepseek
    llm_model: deepseek-v4-pro
    temperature: 0.2

  llama4_maverick:
    llm_provider: llama
    llm_model: meta/llama-4-maverick-17b-128e-instruct
    temperature: 0.2

  gpt54:
    llm_provider: openai
    llm_model: gpt-5.4
    reasoning_effort: none
    text_verbosity: low

  gemini_pro:
    llm_provider: gemini
    llm_model: gemini-2.5-pro
    temperature: 0.2
    
  qwen32b:
    llm_provider: llama
    llm_model: Qwen/Qwen2.5-32B-Instruct
    api_base: http://localhost:8000/v1
    api_key_env: LOCAL_API_KEY
    temperature: 0.2
    use_llm_judge: false
    embed_provider: hf
    embed_model: sentence-transformers/all-MiniLM-L6-v2
    embed_device: cpu
    resume: true

  # Local vLLM answer model on 2x L40 (CUDA 4,5); see serve_qwen38.sh.
  # Judging is a separate stage, exactly as for qwen32b: run this sweep with the
  # inline judge off, then grade with
  #   bench/scripts/rejudge.py --judge gpt41   (GPT-4.1 via OpenRouter)
  # so these numbers stay comparable with the existing *__judge-gpt41 results.
  qwen38_27b:
    llm_provider: llama
    llm_model: Qwen/Qwen3.8-27B
    api_base: http://localhost:8000/v1
    api_key_env: LOCAL_API_KEY
    temperature: 0.2
    use_llm_judge: false
    # A local 27B on 2x L40 is far slower than a hosted API. The long_context
    # baseline stuffs 200+ turn episodes into one prompt and can generate 4096
    # tokens, which blows past the 60s default: measured p90 57s, max 171s.
    # Timeouts are costly here: each retry throws away and redoes a whole
    # generation, and exhausting the retries aborts the entire run, because
    # runner.py re-raises a failed episode instead of skipping it.
    timeout_s: 1800
    # This budget must cover the reasoning trace AND the answer. At the shared
    # 4096 default, 68 predictions already hit the cap -- with the reasoning
    # parser those would return an EMPTY answer rather than a truncated one,
    # since the whole budget is spent before `content` begins.
    max_output_tokens: 16384
    embed_provider: hf
    embed_model: sentence-transformers/all-MiniLM-L6-v2
    embed_device: cpu
    resume: true
    # Local backbone only -- the hosted-API models stay on the shared default of
    # 4 in configs/runs/paper_main.yaml. At 4 the server ran ~4 concurrent reqs
    # with GPU KV cache usage at 3-5%, i.e. almost entirely idle on capacity.
    # 8 roughly halves wall-clock while keeping ~2.5x headroom under timeout_s
    # against the worst per-request latency measured at 4 (648s, a_mem).
    episode_concurrency: 8

baselines:
  a_mem:
    agent: a_mem

  remem_i:
    agent: remem
    remem_variant: iterative

  remem_s:
    agent: remem
    remem_variant: single

  mem0:
    agent: mem0
    mem0_backend: upstream

  long_context:
    agent: long_context

  rag_naive:
    agent: rag_naive

  rag_policy:
    agent: rag_policy
